apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-landing-deployment
  labels:
    app: saas-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saas-landing
  template:
    metadata:
      labels:
        app: saas-landing
    spec:
      containers:
      - name: saas-landing-container
        image: moazamyasin/saas-landing:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: saas-landing-service
spec:
  selector:
    app: saas-landing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

