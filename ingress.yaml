apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-landing-ingress
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: saas.local  # Is domain par aap ki nayi website khulegi
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: saas-landing-service
            port:
              number: 80
